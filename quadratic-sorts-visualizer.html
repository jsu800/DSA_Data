<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Quadratic sorts visualizer</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f6f7f9;color:#222}
.wrap{max-width:1040px;margin:auto}
h1{font-size:20px;margin:0 0 12px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #dde;border-radius:8px;padding:12px;min-width:0}
#left{flex:1 1 460px;min-width:0}
#side{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:12px}
button{font:inherit;padding:5px 11px;border:1px solid #99a;border-radius:6px;background:#fff;cursor:pointer}
button:hover{background:#eef}
button.on{background:#2b5fd9;color:#fff;border-color:#2b5fd9}
.ctl{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.sep{width:1px;height:22px;background:#ccd}
input[type=number]{font:inherit;padding:5px 8px;border:1px solid #99a;border-radius:6px;width:56px}
#msg{min-height:44px;font-size:15px;padding:8px;background:#fffbe6;border:1px solid #ecd;border-radius:6px}
.lbl{font-size:12px;color:#667;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
pre{margin:0;font-size:12.5px;line-height:1.5;overflow:auto;max-width:100%}
pre span.ln{display:block;padding:0 6px;border-left:3px solid transparent;min-height:1.5em;white-space:pre}
pre span.hl{background:#fff3b0;border-left-color:#e0a800}
.stats{display:flex;gap:24px;font-size:15px}
.stats b{font-size:22px;display:block}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{border:1px solid #dde;padding:4px 8px;text-align:center}
th{background:#f0f2f8}
tr.me td{background:#fff8d6;font-weight:600}
.legend{font-size:12px;color:#556;margin-top:6px;line-height:1.9}
.legend b{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:middle;margin:0 3px 0 10px;border:1px solid #556}
.bar{transition:none}
.num{font-size:15px;font-weight:700;text-anchor:middle}
.idx{font-size:11px;fill:#778;text-anchor:middle}
</style></head><body><div class="wrap">
<h1>Quadratic sorts visualizer</h1>
<div class="ctl">
 <button id="bBubble" class="on">Bubble</button><button id="bSelection">Selection</button><button id="bInsertion">Insertion</button>
 <span class="sep"></span>
 <button id="bBack">&larr; Back</button><button id="bNext">Next &rarr;</button>
 <button id="bPlay">Play</button><button id="bReset">Reset</button>
 <span id="count" style="color:#667"></span>
</div>
<div class="card" style="margin-bottom:12px">
 <div class="lbl">Input array</div>
 <div class="ctl" style="margin-bottom:0">
  Size <input type="number" id="nIn" min="3" max="12" value="6">
  <span class="sep"></span>
  <button data-p="example">Example [5 2 4 6 1 3]</button><button data-p="random">Random</button><button data-p="sorted">Already sorted</button>
  <button data-p="reversed">Reversed</button><button data-p="nearly">Nearly sorted</button><button data-p="dups">Many duplicates</button>
 </div>
</div>
<div class="row">
 <div id="left" class="card">
  <svg id="svg" viewBox="0 0 600 340" width="100%"></svg>
  <div class="legend" id="legend"></div>
 </div>
 <div id="side">
  <div id="msg"></div>
  <div class="card"><div class="stats"><div><span class="lbl">Comparisons</span><b id="sCmp">0</b></div><div><span class="lbl" id="mvLbl">Swaps</span><b id="sMv">0</b></div></div></div>
  <div class="card"><pre id="code"></pre></div>
  <div class="card"><div class="lbl">Totals for this array (full run)</div><table id="tbl"></table></div>
 </div>
</div></div>
<p style="margin:24px 0 0;text-align:center;color:#5b6170;font-size:13px">© 2026 Joseph Su. All rights reserved. For enrolled students only.</p>
<script>
// CORE-START
const CODE={
bubble:[["","for (int pass = 0; pass < n - 1; pass++) {"],["outer","    boolean swapped = false;"],["inner","    for (int j = 0; j < n - 1 - pass; j++) {"],["cmp","        if (a[j] > a[j + 1]) {"],["swap","            swap(a, j, j + 1); swapped = true;"],["","        }"],["","    }"],["stop","    if (!swapped) break;"],["","}"]],
selection:[["outer","for (int i = 0; i < n - 1; i++) {"],["min","    int min = i;"],["inner","    for (int j = i + 1; j < n; j++) {"],["cmp","        if (a[j] < a[min]) min = j;"],["","    }"],["swap","    if (min != i) swap(a, i, min);"],["","}"]],
insertion:[["outer","for (int i = 1; i < n; i++) {"],["key","    int key = a[i];"],["","    int j = i - 1;"],["cmp","    while (j >= 0 && a[j] > key) {"],["shift","        a[j + 1] = a[j];"],["","        j--;"],["","    }"],["place","    a[j + 1] = key;"],["","}"]]
};
function gen(alg,arr0){
 const a=[...arr0],n=a.length,steps=[],log=[];
 let cmp=0,mov=0;const done=new Set();
 const snap=(msg,line,o)=>steps.push(Object.assign({msg,line,arr:[...a],cmp,mov,hi:[],sw:[],done:[...done],minIdx:null,key:null,hole:null,prefix:-1},o||{}));
 if(alg==="bubble"){
  snap("Start. Each pass compares neighbors and swaps them if they are out of order.","",{});
  for(let p=0;p<n-1;p++){
   let swapped=false;
   snap(`Pass ${p+1}: push the largest unsorted value to index ${n-1-p}.`,"outer",{});
   for(let j=0;j<n-1-p;j++){
    cmp++;log.push(`CMP ${j} ${j+1}`);
    const gt=a[j]>a[j+1];
    snap(`Compare a[${j}]=${a[j]} and a[${j+1}]=${a[j+1]}: ${gt?"out of order, swap":"in order, leave them"}.`,"cmp",{hi:[j,j+1]});
    if(gt){const x=a[j],y=a[j+1];[a[j],a[j+1]]=[y,x];mov++;swapped=true;log.push(`SWAP ${j} ${j+1}`);snap(`Swapped ${x} and ${y}.`,"swap",{sw:[j,j+1]})}
   }
   done.add(n-1-p);
   if(!swapped){log.push("STOP");for(let k=0;k<n;k++)done.add(k);snap("No swaps in this pass, so the array is already sorted. Stop early.","stop",{});break}
  }
  done.add(0);
 }else if(alg==="selection"){
  snap("Start. Each round finds the smallest remaining value and swaps it into place.","",{});
  for(let i=0;i<n-1;i++){
   let min=i;
   snap(`Round ${i+1}: find the smallest value in a[${i}..${n-1}]. Assume the min is index ${i} (${a[i]}).`,"min",{minIdx:min});
   for(let j=i+1;j<n;j++){
    cmp++;log.push(`CMP ${j} ${min}`);
    const lt=a[j]<a[min];
    snap(`Compare a[${j}]=${a[j]} with the current min a[${min}]=${a[min]}: ${lt?"smaller, new min":"not smaller"}.`,"cmp",{hi:[j],minIdx:min});
    if(lt){min=j;log.push(`MIN ${j}`);snap(`New min is index ${j} (${a[j]}).`,"cmp",{minIdx:min})}
   }
   if(min!==i){const x=a[i],y=a[min];a[i]=y;a[min]=x;mov++;log.push(`SWAP ${i} ${min}`);done.add(i);snap(`Swap a[${i}] and a[${min}]: ${y} goes to index ${i}.`,"swap",{sw:[i,min]})}
   else{log.push(`KEEP ${i}`);done.add(i);snap(`The min is already at index ${i}. No swap.`,"swap",{})}
  }
  done.add(n-1);
 }else{
  snap("Start. Index 0 alone is a sorted prefix. Insert each next value into it.","",{prefix:0});
  for(let i=1;i<n;i++){
   const key=a[i];let j=i-1,hole=i;
   log.push(`KEY ${i}`);
   snap(`Pick up key=${key} from index ${i}. Insert it into the sorted prefix a[0..${i-1}].`,"key",{key,hole,prefix:i-1});
   while(j>=0){
    cmp++;log.push(`CMP ${j}`);
    const gt=a[j]>key;
    snap(`Compare a[${j}]=${a[j]} with key ${key}: ${gt?"bigger, shift it right":"not bigger, stop here"}.`,"cmp",{hi:[j],key,hole:j+1,prefix:i-1});
    if(!gt)break;
    a[j+1]=a[j];mov++;log.push(`SHIFT ${j} ${j+1}`);hole=j;
    snap(`Shift ${a[j+1]} one place right.`,"shift",{sw:[j+1],key,hole,prefix:i-1});
    j--;
   }
   a[j+1]=key;log.push(`PLACE ${j+1}`);
   snap(`Place key ${key} at index ${j+1}. The prefix a[0..${i}] is now sorted.`,"place",{hi:[j+1],prefix:i});
  }
  for(let k=0;k<n;k++)done.add(k);
 }
 log.push(`DONE [${a.join(", ")}] cmp=${cmp} moves=${mov}`);
 snap(`Sorted. ${cmp} comparisons, ${mov} ${alg==="insertion"?"shifts":"swaps"}.`,"",{});
 return {steps,log,cmp,mov};
}
// CORE-END

let ARR=[],mode="bubble",i=0,timer=null,RUN={},PAT="example";
const $=id=>document.getElementById(id);
const svg=$("svg");
function rnd(n){return Math.floor(Math.random()*n)}
function makeArray(p,n){
 if(p==="example"){return [5,2,4,6,1,3]}
 const vals=new Set();while(vals.size<n)vals.add(5+rnd(95));
 let a=[...vals];
 if(p==="random")return a;
 a.sort((x,y)=>x-y);
 if(p==="sorted")return a;
 if(p==="reversed")return a.reverse();
 if(p==="nearly"){for(let k=0;k<Math.max(1,Math.floor(n/5));k++){const j=rnd(n-1);[a[j],a[j+1]]=[a[j+1],a[j]]}return a}
 if(p==="dups")return Array.from({length:n},()=>[10,20,30][rnd(3)]);
 return a;
}
function load(p,n){
 PAT=p;ARR=makeArray(p,n);
 $("nIn").value=ARR.length;
 RUN={bubble:gen("bubble",ARR),selection:gen("selection",ARR),insertion:gen("insertion",ARR)};
 stop();i=0;render();
}
function render(){
 const R=RUN[mode],S=R.steps[i],n=ARR.length;
 const W=600,H=340,top=40,base=290,mx=Math.max(...ARR),bw=W/n,pad=Math.min(10,bw*0.15);
 let h="";
 for(let k=0;k<n;k++){
  const v=S.arr[k],bh=Math.max(14,(v/mx)*(base-top-40)),x=k*bw+pad/2,w=bw-pad;
  if(S.hole===k){h+=`<rect x="${x}" y="${base-bh}" width="${w}" height="${bh}" fill="none" stroke="#99a" stroke-dasharray="5 4" stroke-width="2"/>`}
  else{
   let c="#cfe0ff";
   if(mode==="insertion"&&k<=S.prefix)c="#c8e6c9";
   if(S.done.includes(k)&&mode!=="insertion")c="#8fd19e";
   if(S.minIdx===k)c="#b388ff";
   if(S.hi.includes(k))c="#ffd75e";
   if(S.sw.includes(k))c="#ff8a80";
   h+=`<rect class="bar" x="${x}" y="${base-bh}" width="${w}" height="${bh}" fill="${c}" stroke="#556" stroke-width="1.5" rx="3"/>`;
   h+=`<text class="num" x="${x+w/2}" y="${base-bh-6}">${v}</text>`;
  }
  h+=`<text class="idx" x="${x+w/2}" y="${base+16}">${k}</text>`;
 }
 if(S.key!==null){
  const bh=Math.max(14,(S.key/mx)*(base-top-40)),kx=S.hole*bw+pad/2,w=bw-pad;
  h+=`<rect x="${kx}" y="${base-bh-34}" width="${w}" height="${bh}" fill="#6ea0ff" stroke="#14307a" stroke-width="2" rx="3" opacity=".9"/>`;
  h+=`<text class="num" x="${kx+w/2}" y="${base-bh-40}" fill="#14307a">key ${S.key}</text>`;
 }
 svg.innerHTML=h;
 $("msg").textContent=S.msg;
 $("sCmp").textContent=S.cmp;$("sMv").textContent=S.mov;
 $("mvLbl").textContent=mode==="insertion"?"Shifts":"Swaps";
 $("code").innerHTML=CODE[mode].map(([id,t])=>`<span class="ln ${id&&id===S.line?"hl":""}">${t.replace(/</g,"&lt;")||" "}</span>`).join("");
 $("count").textContent=`step ${i+1} / ${R.steps.length}`;
 const nm={bubble:"Bubble",selection:"Selection",insertion:"Insertion"};
 $("tbl").innerHTML="<tr><th>Algorithm</th><th>Comparisons</th><th>Swaps / shifts</th></tr>"+Object.keys(nm).map(a=>`<tr class="${a===mode?"me":""}"><td>${nm[a]}</td><td>${RUN[a].cmp}</td><td>${RUN[a].mov}${a==="insertion"?" (shifts)":""}</td></tr>`).join("")+`<tr><td colspan="3" style="color:#667">n = ${n}, so n(n\u22121)/2 = ${n*(n-1)/2}</td></tr>`;
 const sq=(c,t)=>`<b style="background:${c}"></b>${t}`;
 let lg=sq("#cfe0ff","unsorted")+sq("#ffd75e","being compared")+sq("#ff8a80","just swapped / shifted");
 if(mode==="selection")lg+=sq("#b388ff","current min");
 if(mode==="insertion")lg+=sq("#c8e6c9","sorted prefix")+sq("#6ea0ff","key in hand");else lg+=sq("#8fd19e","in final place");
 $("legend").innerHTML=lg;
}
function go(d){i=Math.max(0,Math.min(RUN[mode].steps.length-1,i+d));render()}
function stop(){clearInterval(timer);timer=null;$("bPlay").textContent="Play"}
function setMode(m){stop();mode=m;i=0;for(const k of ["Bubble","Selection","Insertion"])$("b"+k).className=(k.toLowerCase()===m)?"on":"";render()}
$("bBubble").onclick=()=>setMode("bubble");$("bSelection").onclick=()=>setMode("selection");$("bInsertion").onclick=()=>setMode("insertion");
$("bNext").onclick=()=>{stop();go(1)};$("bBack").onclick=()=>{stop();go(-1)};
$("bReset").onclick=()=>{stop();i=0;render()};
$("bPlay").onclick=()=>{if(timer)return stop();$("bPlay").textContent="Pause";if(i>=RUN[mode].steps.length-1)i=0;timer=setInterval(()=>{if(i>=RUN[mode].steps.length-1)return stop();go(1)},700)};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){stop();go(1)}if(e.key==="ArrowLeft"){stop();go(-1)}});
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>load(b.dataset.p,Math.max(3,Math.min(12,Math.round(+$("nIn").value)||6))));
$("nIn").onchange=()=>{const n=Math.round(+$("nIn").value);if(!(n>=3&&n<=12)){$("nIn").value=ARR.length;return}load(PAT==="example"?"random":PAT,n)};
load("example",6);
</script></body></html>
